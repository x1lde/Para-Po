<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="_R_0_-title _R_0_-desc"><title id="_R_0_-title">Illustrated Makati map preview</title><desc id="_R_0_-desc">Schematic sample geography, not a navigation map. Vehicle icons mark sample boarding locations. Choose a journey to preview its route.</desc><defs><style>.map-land { fill: #292f3c; }
.building { fill: #323948; }
.building-1 { fill: #323948; }
