.building-edge { stroke: #fff; stroke-width: 1; opacity: .6; }
.minor-streets, .major-streets { stroke: #fff; }
.road-edge { stroke: #252a36; }
.road-center { stroke: #252a36; }
.park { fill: #3b5148; stroke: #435e51; stroke-width: 1; }
