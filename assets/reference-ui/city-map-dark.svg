.landmark-labels { fill: #9cceb6; font-size: 14px; font-weight: 550; }
.map-stop { fill: #fff; stroke: #e3e5ee; stroke-width: 1; }
.map-stop-shadow { fill: #44415b; opacity: .06; }
.you-label { fill: #fff; }
.you-label-text { fill: #262b43; font-size: 12px; font-weight: 650; }
